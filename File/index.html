<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Platform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background"></div>
    
    <div class="container">
        <div class="profile-section">
            <!-- Avatar dengan glow -->
            <div class="avatar-wrapper">
                <div class="avatar">
                    <img src="https://via.placeholder.com/150?text=Avatar" alt="Profile">
                </div>
            </div>

            <!-- Username -->
            <h1 class="username">DaxterrOnly</h1>
            
            <!-- Call to action -->
            <p class="cta">Any Question?</p>

            <!-- User Card -->
            <div class="user-card">
                <div class="user-card-content">
                    <img src="https://via.placeholder.com/50?text=Avatar" alt="User" class="user-avatar">
                    <div class="user-info">
                        <h2 class="user-name">DaxterrAntaress</h2>
                        <p class="user-status">currently doing nothing</p>
                    </div>
                </div>
            </div>

            <!-- Social Links -->
            <div class="social-links">
                <a href="https://www.youtube.com/@JustDaxterAlways" class="social-icon youtube" title="YouTube" target="_blank">
                    <svg viewBox="0 0 24 24" fill="currentColor">

                    </svg>
                </a>

                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20.317 4.3698a19.7913 19.7913 0 00-4.885-1.515.0361.0361 0 00-.0387.0186c-.211.375-.444.864-.607 1.25a18.0365 18.0365 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.037.037 0 00-.038-.0186 19.7363 19.7363 0 00-4.885 1.515.0331.0331 0 00-.016.0109C.533 9.046-.32 13.58.099 18.057a.0372.0372 0 00.015.028 19.9161 19.9161 0 005.993 3.03.0347.0347 0 00.038-.0136 13.146 13.146 0 001.07-1.73.0407.0407 0 00-.022-.057 13.201 13.201 0 01-1.88-.892.0366.0366 0 01-.036-.055 9.75 9.75 0 00.372-.592.0364.0364 0 01.038-.047 19.738 19.738 0 0015.921-9.979.0348.0348 0 00.028-.044 13.895 13.895 0 00-1.519-3.851.0361.0361 0 00-.055-.034 19.118 19.118 0 01-1.882.892.0366.0366 0 01-.038-.057c.312-.612.603-1.253 1.07-1.73a.0347.0347 0 00.038-.0136 19.9069 19.9069 0 005.993-3.03.0348.0348 0 00.015-.027C23.7767 5.009 23.9287 4.536 20.317 4.3698zM8.02 15.3312c-1.464 0-2.666-1.346-2.666-3.0061 0-1.6603 1.184-3.0061 2.666-3.0061 1.496 0 2.666 1.3458 2.652 3.0061 0 1.6603-1.184 3.0061-2.652 3.0061zm7.986 0c-1.464 0-2.666-1.346-2.666-3.0061 0-1.6603 1.184-3.0061 2.666-3.0061 1.496 0 2.666 1.3458 2.652 3.0061 0 1.6603-1.156 3.0061-2.652 3.0061z"/>

                <a href="#" class="social-icon facebook" title="Facebook">

            <div class="view-counter">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>

    <script src="script.js"></script>
</body>
</html>
